{% extends "base.html" %}
{% block title %}Log in - Legal-Aid Vault{% endblock %}
{% block content %}
<div class="auth-center">
<section class="card">
    <h2>Log in</h2>
    <form method="post">
        {{ form.hidden_tag() }}
        <label for="username">Username</label>
        {{ form.username() }}
        <label for="password">Password</label>
        {{ form.password() }}
        <button type="submit">Log in</button>
    </form>
    <p>No account yet? <a href="{{ url_for('vault.register') }}">Register</a>.</p>
</section>
</div>
{% endblock %}
